name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall src tests
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src/gaia
      - name: Pytest
        run: python -m pytest

  dart_integration_client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
      - name: Pub get
        working-directory: packages/gaia_integration_client
        run: dart pub get
      - name: Analyze
        working-directory: packages/gaia_integration_client
        run: dart analyze
      - name: Test
        working-directory: packages/gaia_integration_client
        run: dart test

  dashboard_module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        working-directory: packages/gaia_dashboard_module
        run: flutter pub get
      - name: Analyze
        working-directory: packages/gaia_dashboard_module
        run: flutter analyze
      - name: Test
        working-directory: packages/gaia_dashboard_module
        run: flutter test

  example_host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        working-directory: examples/gaia_dashboard_host
        run: flutter pub get
      - name: Analyze
        working-directory: examples/gaia_dashboard_host
        run: flutter analyze
      - name: Test
        working-directory: examples/gaia_dashboard_host
        run: flutter test

  windows_app:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        working-directory: apps/gaia_windows
        run: flutter pub get
      - name: Analyze
        working-directory: apps/gaia_windows
        run: flutter analyze
      - name: Test
        working-directory: apps/gaia_windows
        run: flutter test
      - name: Build debug
        working-directory: apps/gaia_windows
        run: flutter build windows --debug
      - name: Build release
        working-directory: apps/gaia_windows
        run: flutter build windows --release

  windows_validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Export OpenAPI contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\export_openapi_contract.ps1
      - name: Validate managed backend scripts
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\validate_managed_backend_scripts.ps1
      - name: Validate VS Code workspace
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\validate_vscode_workspace.ps1
      - name: Validate receipt chains
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\validate_receipt_chains.ps1
      - name: Validate action templates
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\validate_action_templates.ps1
      - name: Validate dashboard module
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\validate_dashboard_module.ps1
      - name: Validate integration contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\validate_integration_contract.ps1
      - name: Run v0.6 validation
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\run_v0_6_validation.ps1
      - name: Release readiness
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release_readiness.ps1
